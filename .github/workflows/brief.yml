name: brief

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node brief.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: commit the page
        run: |
          git config user.name "briefing bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add public data
          git commit -m "brief: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
